landing.pain.eyebrow=El problema
landing.pain.title=Lo que hoy se pierde entre la libreta y el WhatsApp
landing.pain.subtitle=En México la enorme mayoría de estos negocios son microempresas o profesionales independientes: no tienen sistema ni área de sistemas, pero sí un celular con WhatsApp y una agenda llena. Club VIP entra por ahí: la misma herramienta que ya usan, ordenada.
landing.pain.business=Dolores del negocio
landing.pain.business.1=Citas que se empalman o se olvidan: la agenda vive en papel o en la cabeza del dueño.
landing.pain.business.2=Ausentismo: el cliente no llega y la hora ya no se puede vender.
landing.pain.business.3=Precios que se improvisan porque la lista no está a la vista.
landing.pain.business.4=Clientes que se van sin ruido: nadie detecta al que dejó de volver.
landing.pain.business.5=Comisiones a mano que consumen horas cada quincena.
landing.pain.business.6=Producto que no se vende porque nadie lo ofrece a tiempo.
landing.pain.customer=Dolores del cliente
landing.pain.customer.1=No sabe cuánto va a costar hasta que llega al mostrador.
landing.pain.customer.2=Agendar es una conversación larga de mensajes hasta cuadrar un horario.
landing.pain.customer.3=No sabe quién lo va a atender ni si esa persona está disponible.
landing.pain.customer.4=Se le olvida la cita porque nadie se la recuerda.
landing.pain.customer.5=No puede pedir la marca que usa con anticipación.
landing.pain.customer.6=Su fidelidad no vale nada y no tiene dónde opinar.
landing.diff.eyebrow=Lo que distingue a Club VIP
landing.diff.title=Seis piezas que ningún directorio tiene
landing.diff.1.title=Verificación Club VIP
landing.diff.1.text=El negocio acredita su cédula o título cuando aplica y obtiene el distintivo verificado. El cliente sabe a quién le confía su salud, su mascota o su auto.
landing.diff.2.title=Pre-adquisición de productos
landing.diff.2.text=El cliente elige desde la app, antes de su cita, el tinte de su marca, la refacción o las croquetas. El negocio los prepara y los cobra contra entrega.
landing.diff.3.title=Expediente pre y post consulta
landing.diff.3.text=Lo que el cliente informó antes y lo relevante que ocurrió después quedan en su historial, disponible para quien lo atienda la próxima vez.
landing.diff.4.title=WhatsApp integrado
landing.diff.4.text=Cualquier persona, registrada o no, contacta al negocio con un toque. Felicitaciones, recordatorios y reactivación se envían desde la misma app.
landing.diff.5.title=Lealtad configurable
landing.diff.5.text=El negocio diseña su tarjeta de recompensas: cada cuántos servicios y cuál es el premio. El cliente ve su avance en tiempo real.
landing.diff.6.title=Inventario real
landing.diff.6.text=Entradas con costo promedio ponderado, existencias, movimientos y conteo físico. Cada producto entregado descuenta solo al cerrar el servicio.
landing.outcome.eyebrow=La oportunidad
landing.outcome.title=Tres resultados desde el primer día
landing.outcome.1.title=Ordena la operación
landing.outcome.1.text=Agenda, precios, personal, inventario y cobro en un solo lugar, en tiempo real y accesible desde el celular.
landing.outcome.2.title=Retiene al cliente
landing.outcome.2.text=Recordatorios, recompensas, felicitaciones y reactivación de inactivos, todo por el canal que el cliente ya usa.
landing.outcome.3.title=Aumenta el ticket
landing.outcome.3.text=La pre-adquisición de productos convierte cada cita en una venta adicional, preparada desde antes.
landing.journey.eyebrow=Cómo funciona
landing.journey.title=El recorrido completo, de la búsqueda a la recompensa
landing.journey.1.title=Descubre el negocio
landing.journey.1.text=El cliente encuentra negocios cercanos por giro, con logotipo, distintivo ✔, calificación y opiniones reales.
landing.journey.2.title=Elige servicio, persona y horario
landing.journey.2.text=Precio y duración a la vista. El calendario ofrece únicamente los huecos reales, hasta con un mes de anticipación.
landing.journey.3.title=Aparta los productos que quiere
landing.journey.3.text=El tinte de su marca, el aceite de su auto, las croquetas de su perro: se cobran contra entrega el día del servicio.
landing.journey.4.title=Informa lo relevante y confirma
landing.journey.4.text=Captura la pre-consulta: alergias, antecedentes, falla del vehículo. Paga en línea si el negocio lo ofrece, o en el mostrador.
landing.journey.5.title=Recibe su resumen y su recordatorio
landing.journey.5.text=Servicio, precio, fecha, hora, quién lo atiende y dirección. La app pone la alarma y el negocio refuerza por WhatsApp.
landing.journey.6.title=Es atendido
landing.journey.6.text=El empleado ve la cita con el expediente completo y, al terminar, registra la post-consulta y la recomendación.
landing.journey.7.title=Califica y acumula
landing.journey.7.text=De 1 a 5 estrellas y una opinión breve. Cada servicio asistido sella su tarjeta de recompensas.
landing.journey.8.title=Vuelve
landing.journey.8.text=Si deja de venir aparece en la lista de inactivos; en su cumpleaños recibe la felicitación con una promoción directo a su WhatsApp.
landing.sector.eyebrow=A quién va dirigido
landing.sector.title=Diseñado para negocios que viven de citas
landing.sector.subtitle=Toda la plataforma gira alrededor de una agenda con horarios, personal asignado y servicios con precio.
landing.sector.1.title=Salud y bienestar
landing.sector.1.who=Dentistas, pediatras, especialistas
landing.sector.1.text=Acreditan cédula o título al registrarse y obtienen la verificación. Usan intensamente el expediente pre y post consulta.
landing.sector.2.title=Cuidado y estética personal
landing.sector.2.who=Salones, peluquerías, barberías
landing.sector.2.text=Agenda por estilista, servicios con duración y precio variable, pre-adquisición de tintes y tratamientos y alto peso del programa de lealtad.
landing.sector.3.title=Servicios para mascotas
landing.sector.3.who=Estéticas caninas, veterinarias
landing.sector.3.text=Expediente del paciente, recordatorios de vacunas y venta de croquetas, juguetes y accesorios el día de la cita.
landing.sector.4.title=Servicios generales y oficios
landing.sector.4.who=Talleres mecánicos, plomería, cerrajería
landing.sector.4.text=Cita como visita a domicilio o recepción en taller, con refacciones, aceites y balatas pre-apartadas por marca de preferencia.
landing.deliver.eyebrow=Qué incluye
landing.deliver.title=Tres aplicaciones sobre un mismo backend
landing.deliver.app.title=App móvil
landing.deliver.app.text=Una sola app que cambia de cara según el perfil: cliente, administrador o empleado. Todo el día del negocio se opera desde el celular.
landing.deliver.web.title=Portal web de administración
landing.deliver.web.text=Tablero, agenda semanal, catálogos, inventario, lealtad, opiniones, nómina, reportes y el back office de Club VIP.
landing.deliver.api.title=Microservicios seguros
landing.deliver.api.text=Toda la lógica en el servidor: disponibilidad sin dobles reservas, cierre de servicio en una transacción y aislamiento total entre negocios.
landing.verify.eyebrow=Confianza
landing.verify.title=La palomita no se regala
landing.verify.text=El distintivo ✔ se otorga solo después de revisar documentación real desde el back office de Club VIP. Es lo que distingue a la red de un directorio cualquiera.
landing.verify.1=El distintivo aparece junto al nombre del negocio en toda la app.
landing.verify.2=Los giros de salud no obtienen la palomita sin cédula o título validado.
landing.verify.3=El propietario se agrega al grupo de WhatsApp de Club VIP.
landing.verify.4=La cuenta de depósito habilita el cobro en línea.
landing.verify.5=Un negocio rechazado puede volver a cargar documentación y reintentar.
