lp.faq.eyebrow=Preguntas
lp.faq.title=Lo que nos preguntan antes de empezar.
lp.faq.q1=¿Tengo que usar las cuatro verticales?
lp.faq.a1=No. Toma una, dos, tres o las cuatro. Si mañana quieres vender en caja, meter tu producto en otras tiendas o pagar comisiones, prendes la vertical y tus clientes e inventario ya están ahí. Consignación funciona junto con Punto de venta.
lp.faq.q2=¿Cómo pongo mi tienda y mi agenda en Instagram o Facebook?
lp.faq.a2=Copias tu link de Club VIP y lo pegas en tu bio, tus historias, tu página de Facebook o tu perfil de WhatsApp Business. También lo puedes imprimir como QR para tu puesto o tu mostrador.
lp.faq.q3=¿Sirve si vendo en un bazar o en el tianguis?
lp.faq.a3=Sí. La caja vive en tu celular: cobras en el puesto, registras abonos y el inventario se descuenta solo. El resto de la semana tu tienda en línea sigue vendiendo.
lp.faq.q4=¿Mis clientes tienen que descargar una app?
lp.faq.a4=No. Pueden agendar desde tu link en cualquier navegador, sin crear cuenta. Si descargan la app y se registran, reciben notificaciones de sus citas, ven su tarjeta de lealtad y les llegan tus descuentos para miembros.
lp.faq.q5=¿Lo puedo manejar desde el celular?
lp.faq.a5=Sí. La app Android cambia según quién entra: dueño, empleado, vendedora o cliente. El portal web es para cuando quieres ver reportes y catálogos en la computadora.
lp.faq.q6=Si trabajo en consignación, ¿la otra tienda ve mis datos?
lp.faq.a6=No. Cada negocio ve solo lo suyo. La tienda ve las piezas que le enviaste y tú ves lo que vendió de lo tuyo. Nada más.
lp.faq.q7=¿Necesito instalar algo o comprar un servidor?
lp.faq.a7=No. Todo vive en la nube. Te registras, das de alta tus servicios o productos y empiezas a trabajar el mismo día.
