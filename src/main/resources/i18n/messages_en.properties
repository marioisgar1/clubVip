lp.faq.eyebrow=Questions
lp.faq.title=What people ask before starting.
lp.faq.q1=Do I have to use all four verticals?
lp.faq.a1=No. Take one, two, three or all four. If tomorrow you want to sell at the till, place your product in other stores or pay commissions, switch the vertical on and your customers and stock are already there. Consignment works together with Point of sale.
lp.faq.q2=How do I put my store and schedule on Instagram or Facebook?
lp.faq.a2=Copy your Club VIP link and paste it in your bio, your stories, your Facebook page or your WhatsApp Business profile. You can also print it as a QR for your stand or counter.
lp.faq.q3=Does it work if I sell at a bazaar or street market?
lp.faq.a3=Yes. The till lives in your phone: get paid at the stand, record installments and stock updates itself. The rest of the week your online store keeps selling.
lp.faq.q4=Do my customers have to download an app?
lp.faq.a4=No. They can book from your link in any browser, with no account. If they download the app and register, they get notifications for their appointments, see their reward card and receive your member discounts.
lp.faq.q5=Can I run it from my phone?
lp.faq.a5=Yes. The Android app changes depending on who signs in: owner, employee, seller or customer. The web portal is for reports and catalogs on a computer.
lp.faq.q6=If I work on consignment, does the other store see my data?
lp.faq.a6=No. Each business sees only its own. The store sees the pieces you sent and you see what it sold of yours. Nothing else.
lp.faq.q7=Do I need to install anything or buy a server?
lp.faq.a7=No. Everything lives in the cloud. Register, add your services or products and start working the same day.
