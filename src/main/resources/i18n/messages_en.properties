landing.pain.eyebrow=The problem
landing.pain.title=What gets lost between the notebook and WhatsApp
landing.pain.subtitle=Most of these businesses are micro-enterprises or independent professionals: no system, no IT department, but a phone with WhatsApp and a full schedule. Club VIP starts right there: the tool they already use, organised.
landing.pain.business=Business pains
landing.pain.business.1=Overlapping or forgotten appointments: the schedule lives on paper or in the owner's head.
landing.pain.business.2=No-shows: the customer never arrives and the hour can no longer be sold.
landing.pain.business.3=Improvised prices because the list is not in sight.
landing.pain.business.4=Customers who leave silently: nobody notices the one who stopped coming.
landing.pain.business.5=Commissions calculated by hand, hours lost every fortnight.
landing.pain.business.6=Products that never sell because nobody offers them on time.
landing.pain.customer=Customer pains
landing.pain.customer.1=Does not know the price until reaching the counter.
landing.pain.customer.2=Booking is a long chat until a time finally fits.
landing.pain.customer.3=Does not know who will serve them or whether that person is free.
landing.pain.customer.4=Forgets the appointment because nobody reminds them.
landing.pain.customer.5=Cannot request the brand they use in advance.
landing.pain.customer.6=Loyalty is worth nothing and there is nowhere to give feedback.
landing.diff.eyebrow=What sets Club VIP apart
landing.diff.title=Six pieces no directory has
landing.diff.1.title=Club VIP verification
landing.diff.1.text=The business proves its professional license or degree when required and earns the verified badge. Customers know who they trust with their health, pet or car.
landing.diff.2.title=Product pre-purchase
landing.diff.2.text=From the app, before the appointment, the customer picks their hair colour brand, the spare part or the pet food. The business prepares it and charges on delivery.
landing.diff.3.title=Pre and post consultation file
landing.diff.3.text=What the customer reported before and what mattered afterwards stay in their history, available to whoever serves them next time.
landing.diff.4.title=WhatsApp built in
landing.diff.4.text=Anyone, registered or not, reaches the business in one tap. Birthday greetings, reminders and win-back messages go out from the same app.
landing.diff.5.title=Configurable loyalty
landing.diff.5.text=The business designs its reward card: how many services and which prize. The customer sees their progress in real time.
landing.diff.6.title=Real inventory
landing.diff.6.text=Entries at weighted average cost, stock on hand, movements and physical counts. Every delivered product is discounted when the service closes.
landing.outcome.eyebrow=The opportunity
landing.outcome.title=Three results from day one
landing.outcome.1.title=Organise the operation
landing.outcome.1.text=Schedule, prices, staff, inventory and payment in one place, in real time, from the phone.
landing.outcome.2.title=Keep the customer
landing.outcome.2.text=Reminders, rewards, birthday greetings and win-back of inactive customers through the channel they already use.
landing.outcome.3.title=Raise the ticket
landing.outcome.3.text=Product pre-purchase turns every appointment into an additional sale, prepared in advance.
landing.journey.eyebrow=How it works
landing.journey.title=The full journey, from search to reward
landing.journey.1.title=Discover the business
landing.journey.1.text=The customer finds nearby businesses by category, with logo, ✔ badge, rating and real reviews.
landing.journey.2.title=Choose service, person and time
landing.journey.2.text=Price and duration in sight. The calendar offers only real openings, up to a month ahead.
landing.journey.3.title=Reserve the products they want
landing.journey.3.text=Their colour brand, their car's oil, their dog's food: charged on delivery on the day of the service.
landing.journey.4.title=Share what matters and confirm
landing.journey.4.text=Pre-consultation notes: allergies, history, vehicle fault. Pay online if the business offers it, or at the counter.
landing.journey.5.title=Get the summary and the reminder
landing.journey.5.text=Service, price, date, time, who serves them and address. The app sets the alarm and the business reinforces by WhatsApp.
landing.journey.6.title=Get served
landing.journey.6.text=The employee sees the appointment with the full file and, when done, records the post-consultation and recommendation.
landing.journey.7.title=Rate and earn
landing.journey.7.text=One to five stars and a short review. Every attended service stamps the reward card.
landing.journey.8.title=Come back
landing.journey.8.text=If they stop coming they appear in the inactive list; on their birthday they get a greeting with a promotion straight to WhatsApp.
landing.sector.eyebrow=Who it is for
landing.sector.title=Built for businesses that live on appointments
landing.sector.subtitle=The whole platform revolves around a schedule with hours, assigned staff and priced services.
landing.sector.1.title=Health and wellness
landing.sector.1.who=Dentists, paediatricians, specialists
landing.sector.1.text=They prove their license or degree when registering and get verified. Heavy users of the pre and post consultation file.
landing.sector.2.title=Beauty and personal care
landing.sector.2.who=Salons, hairdressers, barbershops
landing.sector.2.text=Schedule per stylist, services with variable duration and price, pre-purchase of colour and treatments and a strong loyalty programme.
landing.sector.3.title=Pet services
landing.sector.3.who=Groomers, veterinarians
landing.sector.3.text=Patient file, vaccine reminders and sale of food, toys and accessories on the day of the appointment.
landing.sector.4.title=General services and trades
landing.sector.4.who=Auto repair, plumbing, locksmiths
landing.sector.4.text=Appointment as a home visit or workshop reception, with parts, oils and brake pads reserved by the customer's preferred brand.
landing.deliver.eyebrow=What is included
landing.deliver.title=Three applications on one backend
landing.deliver.app.title=Mobile app
landing.deliver.app.text=One app that changes face by profile: customer, administrator or employee. The whole business day runs from the phone.
landing.deliver.web.title=Administration web portal
landing.deliver.web.text=Dashboard, weekly schedule, catalogues, inventory, loyalty, reviews, payroll, reports and the Club VIP back office.
landing.deliver.api.title=Secure microservices
landing.deliver.api.text=All the logic on the server: availability without double booking, service closing in one transaction and full isolation between businesses.
landing.verify.eyebrow=Trust
landing.verify.title=The badge is not given away
landing.verify.text=The ✔ badge is granted only after real documentation is reviewed from the Club VIP back office. That is what sets the network apart from any directory.
landing.verify.1=The badge shows next to the business name across the app.
landing.verify.2=Health categories do not get the badge without a validated license or degree.
landing.verify.3=The owner joins the Club VIP WhatsApp group.
landing.verify.4=The deposit account enables online payment.
landing.verify.5=A rejected business can upload documents again and retry.
