<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      lang="#{sessionMb.language}">
<f:view locale="#{sessionMb.locale}">
<h:head>
    <title>#{msg['app.title']} - #{msg['newpwd.title']}</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" type="image/png" href="#{request.contextPath}/resources/img/favicon.png?v=20261010"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;display=swap"/>
    <link rel="stylesheet" href="#{request.contextPath}/resources/css/clubvip.css?v=20261007a"/>
    <link rel="stylesheet" href="#{request.contextPath}/resources/css/homepage.css?v=20261014a"/>
    <link rel="stylesheet" href="#{request.contextPath}/resources/css/auth.css?v=20261013a"/>
</h:head>
<h:body styleClass="hp hp-auth">
    <!-- Same header as login/register; the only way out is logging out -->
    <header class="hp-nav au-nav">
        <div class="hp-nav-in">
            <a class="hp-logo" href="#{request.contextPath}/index.xhtml"><img src="#{request.contextPath}/resources/img/logo-clubvip.svg?v=20261014" alt="Club VIP"/></a>
            <h:form id="langForm" styleClass="hp-lang">
                <p:commandLink styleClass="#{sessionMb.language eq 'es' ? 'on' : ''}" process="@this" update="@none"
                               action="#{sessionMb.changeLanguage('es')}" oncomplete="window.location.reload()">#{msg['hm.lang.es']}</p:commandLink>
                <p:commandLink styleClass="#{sessionMb.language eq 'en' ? 'on' : ''}" process="@this" update="@none"
                               action="#{sessionMb.changeLanguage('en')}" oncomplete="window.location.reload()">#{msg['hm.lang.en']}</p:commandLink>
            </h:form>
            <h:form id="outForm" style="display:inline">
                <p:commandLink action="#{sessionMb.logout}" ajax="false" styleClass="hp-login">#{msg['logout']}</p:commandLink>
            </h:form>
        </div>
    </header>

    <main class="au-panel np-panel">
        <h:form id="form" styleClass="au-card np-card au-form">
            <div class="np-head">
                <span class="au-fp-badge"><i class="pi pi-lock"></i></span>
                <h1 class="au-title">#{msg['newpwd.title']}</h1>
            </div>
            <p class="au-fp-lead">#{msg['newpwd.lead']}</p>
            <p:messages id="msgs" showDetail="false" closable="true"/>

            <div class="field">
                <label for="form:newPassword">#{msg['newpwd.new']}</label>
                <p:password id="newPassword" value="#{newPasswordMb.newPassword}" feedback="false" toggleMask="true"
                            autocomplete="new-password" maxlength="60" styleClass="np-new"/>
            </div>
            <div class="field">
                <label for="form:confirmPassword">#{msg['newpwd.confirm']}</label>
                <p:password id="confirmPassword" value="#{newPasswordMb.confirmPassword}" feedback="false" toggleMask="true"
                            autocomplete="new-password" maxlength="60" styleClass="np-confirm"/>
            </div>

            <ul class="np-rules" id="npRules">
                <li data-rule="len"><i class="pi pi-check"></i>
                    <h:outputFormat value="#{msg['newpwd.rule.length']}"><f:param value="#{newPasswordMb.minLength}"/></h:outputFormat></li>
                <li data-rule="mix"><i class="pi pi-check"></i>#{msg['newpwd.rule.mix']}</li>
                <li data-rule="match"><i class="pi pi-check"></i>#{msg['newpwd.rule.match']}</li>
            </ul>

            <p:commandButton id="btnSave" value="#{msg['newpwd.save']}" icon="pi pi-arrow-right" iconPos="right"
                             action="#{newPasswordMb.save}" update="@form" styleClass="au-submit w-100"/>
            <p class="np-foot au-muted"><i class="pi pi-shield"></i> #{msg['newpwd.foot']}</p>
        </h:form>
    </main>

    <script>
    (function () {
        // Live checklist: purely visual; the server checks length and match again.
        var min = #{newPasswordMb.minLength};
        function q(sel) { return document.querySelector(sel); }
        function update() {
            var a = q('input.np-new, .np-new input'), b = q('input.np-confirm, .np-confirm input');
            if (!a || !b) { return; }
            var v = a.value, c = b.value;
            set('len', v.length >= min);
            set('mix', /[A-Za-z]/.test(v) &amp;&amp; /[0-9]/.test(v));
            set('match', v.length > 0 &amp;&amp; v === c);
        }
        function set(rule, ok) {
            var li = q('#npRules [data-rule="' + rule + '"]');
            if (li) { li.classList.toggle('ok', ok); }
        }
        document.addEventListener('input', function (e) {
            if (e.target.closest('.np-new, .np-confirm')) { update(); }
        });
        document.addEventListener('DOMContentLoaded', update);
        if (window.jQuery) { jQuery(document).on('pfAjaxComplete', update); }
    })();
    </script>
</h:body>
</f:view>
</html>
