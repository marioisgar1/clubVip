<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="card">
            <div class="page-header">
                <span class="page-icon"><i class="pi pi-sitemap"></i></span>
                <h2>#{msg['menu.catalog.family']}</h2>
                <span class="page-subtitle">#{msg['pos.family.subtitle']}</span>
            </div>

            <h:form id="form">
                <p:toolbar>
                    <p:toolbarGroup>
                        <p:commandButton value="#{msg['action.new']}" icon="pi pi-plus"
                                         process="@this" actionListener="#{familyMb.prepareNew}"
                                         update=":form:dialog" oncomplete="PF('familyDialog').show()"
                                         styleClass="ui-button-primary" rendered="#{sessionMb.admin}"/>
                        <p:commandButton icon="pi pi-refresh" title="#{msg['action.refresh']}"
                                         process="@this" actionListener="#{familyMb.refresh}" update=":form:table :messages"
                                         styleClass="ui-button-secondary ml-2"/>
                    </p:toolbarGroup>
                </p:toolbar>

                <p:dataTable id="table" var="fm" value="#{familyMb.families}" paginator="true" rows="10"
                             emptyMessage="#{msg['msg.noData']}" styleClass="mt-2" widgetVar="familyTable"
                             filteredValue="#{familyMb.filtered}" globalFilterOnly="true" reflow="true"
                             paginatorAlwaysVisible="false" rowKey="#{fm.id}" stripedRows="true">
                    <f:facet name="header">
                        <div class="flex-between wrap gap-2">
                            <span class="muted">#{familyMb.families.size()} #{msg['pos.family.count']}</span>
                            <p:inputText id="globalFilter" onkeyup="PF('familyTable').filter()"
                                         placeholder="#{msg['action.search']}"/>
                        </div>
                    </f:facet>
                    <p:column headerText="#{msg['lbl.name']}" sortBy="#{fm.name}"
                              filterBy="#{fm.name}" filterMatchMode="contains">
                        <span style="font-weight:600">#{fm.name}</span>
                    </p:column>
                    <p:column headerText="#{msg['pos.family.attrs']}">
                        <h:outputText value="#{familyMb.attributesOf(fm)}" rendered="#{not empty familyMb.attributesOf(fm)}"/>
                        <h:outputText value="#{msg['pos.family.attrs.none']}" styleClass="muted" rendered="#{empty familyMb.attributesOf(fm)}"/>
                    </p:column>
                    <p:column headerText="" style="width:7rem;text-align:center" rendered="#{sessionMb.admin}">
                        <p:commandButton icon="pi pi-pencil" title="#{msg['action.edit']}"
                                         process="@this" actionListener="#{familyMb.prepareEdit(fm)}"
                                         update=":form:dialog :messages" oncomplete="PF('familyDialog').show()"
                                         styleClass="ui-button-rounded ui-button-text"/>
                        <p:commandButton icon="pi pi-trash" title="#{msg['action.delete']}"
                                         process="@this" actionListener="#{familyMb.delete(fm)}" update=":form:table :messages"
                                         styleClass="ui-button-rounded ui-button-text ui-button-danger">
                            <p:confirm header="#{msg['action.confirm']}" message="#{msg['msg.confirmDelete']}"
                                       icon="pi pi-exclamation-triangle"/>
                        </p:commandButton>
                    </p:column>
                </p:dataTable>

                <p:dialog header="#{msg['menu.catalog.family']}" widgetVar="familyDialog" modal="true" id="dialog"
                          width="500" resizable="false" fitViewport="true" responsive="true" closeOnEscape="true">
                    <div class="form-grid" style="margin-top:.5rem">
                        <div class="field required span-2">
                            <label for="form:famName">#{msg['lbl.name']}</label>
                            <p:inputText id="famName" value="#{familyMb.selected.name}" maxlength="120" required="true"
                                         requiredMessage="#{msg['lbl.name']}: #{msg['msg.required']}"/>
                        </div>
                        <!-- Up to 4 characteristics of its products (Talla, Color, Sabor, Material…) -->
                        <div class="field span-2">
                            <label>#{msg['pos.family.attrs']}</label>
                            <span class="hint" style="display:block;margin-bottom:.5rem">#{msg['pos.family.attrs.hint']}</span>
                            <div class="cv-attr-row">
                                <span class="cv-attr-n">1</span>
                                <p:toggleSwitch id="famAttr1On" value="#{familyMb.selected.attribute1Enabled}">
                                    <p:ajax update="famAttr1Label"/>
                                </p:toggleSwitch>
                                <p:inputText id="famAttr1Label" value="#{familyMb.selected.attribute1Label}" maxlength="40"
                                             disabled="#{not familyMb.selected.attribute1Enabled}"
                                             placeholder="#{msg['pos.family.attr.ph1']}" styleClass="cv-attr-input"/>
                            </div>
                            <div class="cv-attr-row">
                                <span class="cv-attr-n">2</span>
                                <p:toggleSwitch id="famAttr2On" value="#{familyMb.selected.attribute2Enabled}">
                                    <p:ajax update="famAttr2Label"/>
                                </p:toggleSwitch>
                                <p:inputText id="famAttr2Label" value="#{familyMb.selected.attribute2Label}" maxlength="40"
                                             disabled="#{not familyMb.selected.attribute2Enabled}"
                                             placeholder="#{msg['pos.family.attr.ph2']}" styleClass="cv-attr-input"/>
                            </div>
                            <div class="cv-attr-row">
                                <span class="cv-attr-n">3</span>
                                <p:toggleSwitch id="famAttr3On" value="#{familyMb.selected.attribute3Enabled}">
                                    <p:ajax update="famAttr3Label"/>
                                </p:toggleSwitch>
                                <p:inputText id="famAttr3Label" value="#{familyMb.selected.attribute3Label}" maxlength="40"
                                             disabled="#{not familyMb.selected.attribute3Enabled}"
                                             placeholder="#{msg['pos.family.attr.ph3']}" styleClass="cv-attr-input"/>
                            </div>
                            <div class="cv-attr-row">
                                <span class="cv-attr-n">4</span>
                                <p:toggleSwitch id="famAttr4On" value="#{familyMb.selected.attribute4Enabled}">
                                    <p:ajax update="famAttr4Label"/>
                                </p:toggleSwitch>
                                <p:inputText id="famAttr4Label" value="#{familyMb.selected.attribute4Label}" maxlength="40"
                                             disabled="#{not familyMb.selected.attribute4Enabled}"
                                             placeholder="#{msg['pos.family.attr.ph4']}" styleClass="cv-attr-input"/>
                            </div>
                        </div>
                    </div>
                    <style type="text/css">
                        .cv-attr-row { display: flex; align-items: center; gap: .6rem; margin-bottom: .45rem; }
                        .cv-attr-n { width: 1.5rem; height: 1.5rem; border-radius: 50%; background: #F4FBE3; color: #5B7720; font-size: .75rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: none; }
                        .cv-attr-input { flex: 1; min-width: 0; }
                    </style>
                    <f:facet name="footer">
                        <p:commandButton value="#{msg['action.save']}" icon="pi pi-check"
                                         actionListener="#{familyMb.save}" update=":form:table :messages"
                                         styleClass="ui-button-primary"/>
                        <p:commandButton value="#{msg['action.cancel']}" icon="pi pi-times"
                                         onclick="PF('familyDialog').hide()" type="button"
                                         styleClass="ui-button-secondary"/>
                    </f:facet>
                </p:dialog>

                <p:confirmDialog global="true">
                    <p:commandButton value="#{msg['action.yes']}" type="button"
                                     styleClass="ui-confirmdialog-yes ui-button-primary"/>
                    <p:commandButton value="#{msg['action.no']}" type="button"
                                     styleClass="ui-confirmdialog-no ui-button-secondary"/>
                </p:confirmDialog>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
