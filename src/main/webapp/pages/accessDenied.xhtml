<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="page-header">
            <span class="page-icon"><i class="pi pi-lock"></i></span>
            <h2>#{msg['accessDenied.title']}</h2>
        </div>
        <div class="card cv-denied">
            <span class="cv-denied-icon"><i class="pi pi-lock"></i></span>
            <p>#{msg['accessDenied.text']}</p>
            <h:outputLink value="#{request.contextPath}/pages/dashboard.xhtml" styleClass="cv-pill">
                <i class="pi pi-home"></i>#{msg['action.back']}
            </h:outputLink>
        </div>
    </ui:define>
</ui:composition>
