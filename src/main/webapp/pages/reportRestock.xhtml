<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <!-- Products to restock: stock at or below its minimum, Línea and Outlet in separate tabs. -->
    <ui:define name="content">
        <div class="page-header">
            <span class="page-icon"><i class="pi pi-cart-plus"></i></span>
            <h2>#{msg['menu.report.restock']}</h2>
            <span class="page-subtitle">#{msg['pos.report.restock.subtitle']}</span>
        </div>

        <h:form id="form">
            <div class="card">
                <p:toolbar styleClass="mb-2">
                    <p:toolbarGroup>
                        <p:commandButton value="#{msg['action.refresh']}" icon="pi pi-refresh"
                                         actionListener="#{reportRestockMb.load}" update="@form :messages"
                                         styleClass="ui-button-primary"/>
                    </p:toolbarGroup>
                </p:toolbar>

                <p:tabView id="tabs">
                    <p:tab title="#{msg['pub.store.line']} (#{reportRestockMb.line.size()})">
                        <ui:include src="/WEB-INF/includes/restockTab.xhtml">
                            <ui:param name="rows" value="#{reportRestockMb.line}"/>
                            <ui:param name="tableId" value="lineTable"/>
                            <ui:param name="outletTab" value="#{false}"/>
                        </ui:include>
                    </p:tab>
                    <p:tab title="#{msg['pub.store.outlet']} (#{reportRestockMb.outlet.size()})">
                        <ui:include src="/WEB-INF/includes/restockTab.xhtml">
                            <ui:param name="rows" value="#{reportRestockMb.outlet}"/>
                            <ui:param name="tableId" value="outletTable"/>
                            <ui:param name="outletTab" value="#{true}"/>
                        </ui:include>
                    </p:tab>
                </p:tabView>
            </div>
        </h:form>
        <style type="text/css">
            .cv-thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid var(--vip-border); background: var(--vip-surface-2); }
            .cv-thumb-empty { display: inline-flex; align-items: center; justify-content: center; color: var(--vip-text-muted); }
            .cv-stock-pill { display: inline-flex; align-items: center; gap: .3rem; padding: .3rem .75rem; border-radius: 999px; font-size: .82rem; font-weight: 600; white-space: nowrap; }
            .cv-stock-pill b { font-size: 1rem; }
            .cv-stock-pill .pi { font-size: .8rem; }
            .cv-stock-pill.is-ok { background: #EEF8D6; color: #5B7720; box-shadow: inset 0 0 0 1px #D6EAA6; }
            .cv-stock-pill.is-low { background: #FFF3D6; color: #9A6400; box-shadow: inset 0 0 0 1px #F2DCA6; }
            .cv-stock-pill.is-out { background: #FDE7E7; color: #B3261E; box-shadow: inset 0 0 0 1px #F5C6C6; }
        </style>
    </ui:define>
</ui:composition>
